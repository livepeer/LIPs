name: LIP status check

# Fails when a LIP's status disagrees between its file frontmatter and the
# README index table (see scripts/check-lip-status.mjs). Add this as a required
# status check in branch protection to block half-updated status changes.

# No paths filter: a required check must report on every PR, and a
# path-filtered workflow reports nothing on PRs outside its paths.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node scripts/check-lip-status.mjs
